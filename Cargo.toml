[package]
name = "libovr-openxr"
version = "0.3.0"
edition = "2024"
description = "LibOVR 1.94 compatibility shim backed by OpenXR"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "libovr_openxr"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "echo_patcher"
path = "echo_patcher/main.rs"

[dependencies]
# Dynamic loader discovery keeps the shim independent of an import library and
# lets Wine/Proton select the platform OpenXR bridge at runtime.
openxr = "0.21.1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
rand = "0.9"
rfd = "0.15"
slint = "=1.17.1"

[build-dependencies]
slint-build = "=1.17.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
panic = "warn"
unwrap_used = "warn"
