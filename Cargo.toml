[package]
name = "libovr-openxr"
version = "0.1.0"
edition = "2024"
description = "LibOVR 1.94 compatibility shim backed by OpenXR"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "libovr_openxr"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enables dynamic OpenXR-loader discovery. It stays feature-gated so host unit
# tests remain independent of a runtime, HMD, and graphics driver.
openxr = ["dep:openxr"]

[dependencies]
openxr = { version = "0.21.1", optional = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
panic = "warn"
unwrap_used = "warn"
