[package]
name = "libovr-openxr"
version = "0.1.0"
edition = "2024"
description = "LibOVR 1.94 compatibility shim backed by OpenXR"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "libovr_openxr"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Dynamic loader discovery keeps the shim independent of an import library and
# lets Wine/Proton select the platform OpenXR bridge at runtime.
openxr = "0.21.1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
panic = "warn"
unwrap_used = "warn"
